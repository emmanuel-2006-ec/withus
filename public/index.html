<!-- public/index.html - Updated with authentication -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Web Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Login Screen */
        #loginScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #loginScreen h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
        }

        #loginScreen p {
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }

        .login-form {
            width: 100%;
            max-width: 400px;
        }

        .login-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
        }

        .login-form button {
            width: 100%;
            padding: 15px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-form button:hover {
            transform: scale(1.02);
        }

        .login-error {
            color: #ff4757;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        /* Main Chat UI */
        #mainUI {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
        }

        .header-info .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 15px;
        }

        .header-info .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-indicator.online {
            background: #2ed573;
        }

        .status-indicator.offline {
            background: #ff4757;
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.received {
            background: white;
            color: #333;
            align-self: flex-start;
            border: 1px solid #e0e0e0;
        }

        .message.sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .message.error {
            background: #ff4757;
            color: white;
        }

        .message.system {
            background: #2ed573;
            color: white;
            text-align: center;
            width: 100%;
            max-width: 100%;
        }

        .message.weather, .message.news {
            background: #f0f0f0;
            border-left: 4px solid #667eea;
            width: 100%;
            max-width: 100%;
        }

        .message.trial-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            width: 100%;
            max-width: 100%;
        }

        .message.upgrade-info {
            background: #d1ecf1;
            border-left: 4px solid #17a2b8;
            width: 100%;
            max-width: 100%;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        .file-upload-area {
            padding: 10px 20px;
            background: #f8f8f8;
            border-top: 1px solid #e0e0e0;
            display: none;
        }

        .file-upload-area.active {
            display: block;
        }

        .file-upload-area input[type="file"] {
            margin-right: 10px;
        }

        .file-upload-area button {
            padding: 8px 16px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-right: 10px;
        }

        .file-upload-area button.stop-read {
            background: #ff4757;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

            .header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen">
            <h1>🤖 Bot Service</h1>
            <p>Login to access all features</p>
            <div class="login-form">
                <div class="login-error" id="loginError">Invalid username or password</div>
                <input type="text" id="loginUsername" placeholder="Username" value="blessed">
                <input type="password" id="loginPassword" placeholder="Password" value="emmanuel">
                <button onclick="login()">Login</button>
                <p style="color: rgba(255,255,255,0.6); margin-top: 15px; font-size: 12px;">
                    Default admin: blessed / emmanuel
                </p>
            </div>
        </div>

        <!-- Main UI -->
        <div id="mainUI">
            <div class="header">
                <h1>🤖 Bot Service</h1>
                <div class="header-info">
                    <span class="user-badge" id="userBadge">👤 Loading...</span>
                    <span>
                        <span class="status-indicator online" id="statusIndicator"></span>
                        <span id="statusText">Connected</span>
                    </span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="chat-area" id="chatArea">
                <div class="message received system">
                    🤖 Welcome! Type <strong>.assist</strong> to see all available commands
                </div>
            </div>

            <div class="file-upload-area" id="fileUploadArea">
                <input type="file" id="fileInput" accept=".txt,.doc,.docx,.pdf">
                <button onclick="uploadFile()">📤 Upload & Start Reading</button>
                <button class="stop-read" onclick="stopReading()">⏹️ Stop Reading</button>
            </div>

            <div class="input-area">
                <input type="text" id="commandInput" placeholder="Type a command... (e.g., .weather, .news, .assist)">
                <button onclick="sendCommand()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let currentUser = null;
        let userId = null;
        let token = null;

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (!username || !password) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Please enter username and password';
                return;
            }

            errorDiv.style.display = 'none';

            // Connect WebSocket and authenticate
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                // Send authentication
                ws.send(JSON.stringify({
                    type: 'auth',
                    username: username,
                    password: password
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleAuthMessage(data);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
            };

            ws.onerror = (error) => {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Connection error. Please try again.';
            };
        }

        function handleAuthMessage(data) {
            if (data.type === 'auth_success') {
                currentUser = data.data;
                userId = data.data.userId;
                token = data.data.token;

                // Switch to main UI
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainUI').style.display = 'flex';

                // Update user badge
                const role = currentUser.role === 'admin' ? '👑 Admin' : '👤 User';
                document.getElementById('userBadge').textContent = `${role}: ${currentUser.username} (${currentUser.userId})`;

                // Show trial info
                if (currentUser.role !== 'admin') {
                    const trials = currentUser.trials;
                    const remaining = trials.total - trials.used;
                    const isPremium = trials.expiry ? new Date(trials.expiry) > new Date() : false;
                    
                    let statusMsg = isPremium ? '✅ Premium User' : `🆓 ${remaining} free trials left`;
                    document.getElementById('userBadge').textContent += ` | ${statusMsg}`;
                }

                // Set up message handler
                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                };

                document.getElementById('statusIndicator').className = 'status-indicator online';
                document.getElementById('statusText').textContent = 'Connected';

                // Add welcome message
                addMessage('system', `✅ Logged in as ${currentUser.username} (${currentUser.userId})`);
                if (currentUser.role === 'admin') {
                    addMessage('system', '👑 You are logged in as Admin');
                }

            } else if (data.type === 'auth_failed') {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginError').textContent = data.data;
            }
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'weather':
                    let weatherHTML = '<div class="message weather"><strong>🌤️ Weather Forecast</strong><br><br>';
                    weatherHTML += `<strong>City:</strong> ${data.data.city}<br><br>`;
                    data.data.forecast.forEach(day => {
                        weatherHTML += `📅 ${day.date}: ${day.temp}°C, ${day.description}, Humidity: ${day.humidity}%<br>`;
                    });
                    weatherHTML += '</div>';
                    document.getElementById('chatArea').innerHTML += weatherHTML;
                    break;

                case 'news':
                    let newsHTML = '<div class="message news"><strong>📰 News</strong><br><br>';
                    data.data.articles.forEach(article => {
                        newsHTML += `📌 <strong>${article.title}</strong><br>`;
                        newsHTML += `${article.description}<br>`;
                        newsHTML += `<small>Source: ${article.source}</small><br><br>`;
                    });
                    newsHTML += '</div>';
                    document.getElementById('chatArea').innerHTML += newsHTML;
                    break;

                case 'read_prompt':
                    document.getElementById('fileUploadArea').classList.add('active');
                    addMessage('system', '📄 Please upload a document to read');
                    break;

                case 'public':
                    addMessage('received', data.data);
                    break;

                case 'confirm':
                    addMessage('sent', `✅ ${data.data}`);
                    break;

                case 'help':
                    addMessage('received', data.data.replace(/\n/g, '<br>'));
                    break;

                case 'developer':
                    const dev = data.data;
                    addMessage('received', `
                        <strong>👨‍💻 Developer Information</strong><br><br>
                        <strong>Name:</strong> ${dev.name}<br>
                        <strong>Education:</strong> ${dev.education}<br>
                        <strong>Program:</strong> ${dev.program}<br>
                        <strong>Skills:</strong> ${dev.skills.join(', ')}
                    `);
                    break;

                case 'tune':
                    addMessage('received', `
                        <strong>🔄 Tuned Text</strong><br><br>
                        <strong>Original:</strong><br>${data.data.original}<br><br>
                        <strong>Humanized:</strong><br>${data.data.humanized}
                    `);
                    break;

                case 'shot_success':
                    addMessage('received', `
                        <strong>📹 Facebook Video</strong><br><br>
                        ${data.data.message}<br>
                        Video ID: ${data.data.videoId}<br>
                        Status: ${data.data.status}
                    `);
                    break;

                case 'shot_progress':
                    addMessage('received', `⏳ ${data.data}`);
                    break;

                case 'error':
                    addMessage('error', `❌ ${data.data}`);
                    break;

                case 'trial_expired':
                    const info = data.data;
                    let upgradeMsg = `⚠️ ${info.message}<br><br>`;
                    upgradeMsg += `<strong>Upgrade Information:</strong><br>`;
                    upgradeMsg += `💰 Price: ${info.upgradeInfo.price}<br>`;
                    upgradeMsg += `📱 Payment Methods:<br>`;
                    info.upgradeInfo.methods.forEach(method => {
                        upgradeMsg += `• ${method.provider}: ${method.number}<br>`;
                    });
                    upgradeMsg += `<br>📲 After payment, send confirmation + your ID to admin on WhatsApp: ${info.upgradeInfo.adminWhatsApp}`;
                    addMessage('upgrade-info', upgradeMsg);
                    break;

                case 'myid':
                    const user = data.data;
                    let idMsg = `📋 <strong>Your User Information</strong><br><br>`;
                    idMsg += `User ID: ${user.userId}<br>`;
                    idMsg += `Username: ${user.username}<br>`;
                    idMsg += `Role: ${user.role}<br>`;
                    idMsg += `Status: ${user.isPremium ? '✅ PREMIUM' : '🆓 Free User'}<br>`;
                    idMsg += `Trials Used: ${user.trials.used}/${user.trials.total}<br>`;
                    if (user.isPremium) {
                        const expiryDate = new Date(user.trials.expiry);
                        const daysLeft = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60 * 24));
                        idMsg += `Premium Expiry: ${new Date(user.trials.expiry).toLocaleDateString()} (${daysLeft} days left)`;
                    }
                    addMessage('received', idMsg);
                    break;

                case 'trials_info':
                    addMessage('trial-info', data.data.replace(/\n/g, '<br>'));
                    break;

                case 'upgrade_success':
                    addMessage('system', `
                        ✅ User ${data.data.userId} (${data.data.username}) upgraded to premium for ${data.data.days} days!
                        Expiry: ${new Date(data.data.expiry).toLocaleDateString()}
                    `);
                    break;

                case 'upgraded':
                    addMessage('system', `🎉 ${data.data.message}<br>Expiry: ${new Date(data.data.expiry).toLocaleDateString()}`);
                    break;

                case 'user_login':
                    addMessage('system', `👤 User ${data.data.userId} (${data.data.username}) logged in at ${new Date(data.data.time).toLocaleTimeString()}`);
                    break;

                case 'history':
                    // Handle message history
                    break;

                default:
                    console.log('Unknown message type:', data);
            }

            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
        }

        function addMessage(type, content) {
            const chatArea = document.getElementById('chatArea');
            const messageClass = type === 'sent' ? 'sent' : 
                               type === 'error' ? 'error' : 
                               type === 'system' ? 'system' : 
                               type === 'trial-info' ? 'trial-info' :
                               type === 'upgrade-info' ? 'upgrade-info' :
                               'received';
            chatArea.innerHTML += `<div class="message ${messageClass}">${content}</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function sendCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value.trim();

            if (!command || !ws || ws.readyState !== WebSocket.OPEN) return;

            // Check for commands that don't require WebSocket
            if (command.startsWith('.read')) {
                ws.send(JSON.stringify({ command: '.read', args: '' }));
            } else if (command.startsWith('.me ')) {
                const message = command.substring(4);
                ws.send(JSON.stringify({ command: '.me', args: message }));
            } else if (command.startsWith('.weather')) {
                const city = command.substring(8).trim() || 'Lilongwe';
                ws.send(JSON.stringify({ command: '.weather', args: city }));
            } else if (command.startsWith('.news')) {
                const category = command.substring(5).trim() || 'global';
                ws.send(JSON.stringify({ command: '.news', args: category }));
            } else if (command === '.assist') {
                ws.send(JSON.stringify({ command: '.assist', args: '' }));
            } else if (command === '.developer') {
                ws.send(JSON.stringify({ command: '.developer', args: '' }));
            } else if (command.startsWith('.tune ')) {
                const text = command.substring(6);
                ws.send(JSON.stringify({ command: '.tune', args: text }));
            } else if (command.startsWith('.shot ')) {
                const link = command.substring(6);
                ws.send(JSON.stringify({ command: '.shot', args: link }));
            } else if (command === '.myid') {
                ws.send(JSON.stringify({ command: '.myid', args: '' }));
            } else if (command === '.trials') {
                ws.send(JSON.stringify({ command: '.trials', args: '' }));
            } else if (command.startsWith('.upgrade ')) {
                const params = command.substring(9);
                ws.send(JSON.stringify({ command: '.upgrade', args: params }));
            } else {
                ws.send(JSON.stringify({ command: command, args: '' }));
            }

            // Display user's command in chat
            addMessage('sent', command);
            input.value = '';
        }

        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                startReading();
            })
            .catch(error => {
                alert('Error uploading file: ' + error.message);
            });
        }

        function startReading() {
            fetch('/read/control', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action: 'start', userId: userId })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            })
            .catch(error => {
                alert('Error starting read: ' + error.message);
            });
        }

        function stopReading() {
            fetch('/read/control', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action: 'stop', userId: userId })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                document.getElementById('fileUploadArea').classList.remove('active');
            })
            .catch(error => {
                alert('Error stopping read: ' + error.message);
            });
        }

        function logout() {
            if (ws) {
                ws.close();
            }
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('chatArea').innerHTML = '';
            currentUser = null;
            userId = null;
            token = null;
        }

        // Enter key to send command
        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendCommand();
            }
        });

        // Enter key to login
        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
