<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Web Service</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(102,126,234,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118,75,162,0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(46,213,115,0.04) 0%, transparent 50%);
            z-index: 0;
            animation: backgroundPulse 10s ease-in-out infinite alternate;
        }
        @keyframes backgroundPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(102,126,234,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102,126,234,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            background: rgba(14,20,34,0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(102,126,234,0.15);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 60px rgba(102,126,234,0.05);
            width: 92%;
            max-width: 860px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: containerAppear 0.8s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes containerAppear { from { opacity:0; transform:scale(0.96) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.1), rgba(46,213,115,0.1));
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite alternate;
        }
        @keyframes borderGlow { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

        /* Login Screen */
        #loginScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
            position: relative;
        }
        #loginScreen h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen .subtitle {
            color: rgba(255,255,255,0.4);
            margin-bottom: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .login-form { width: 100%; max-width: 400px; }
        .login-form input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255,255,255,0.04);
            color: #e0e0e0;
            transition: 0.3s;
        }
        .login-form input:focus { outline: none; border-color: rgba(102,126,234,0.4); background: rgba(255,255,255,0.06); }
        .login-form .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }
        .login-form .btn-login:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(102,126,234,0.3); }
        .login-form .btn-register {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-form .btn-register:hover { background: rgba(255,255,255,0.08); transform: scale(1.02); }
        .login-error {
            color: #ff6b6b;
            background: rgba(255,107,107,0.08);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            display: none;
            border: 1px solid rgba(255,107,107,0.1);
        }
        .login-info {
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }
        .login-info strong { color: rgba(255,255,255,0.4); }
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: rgba(255,255,255,0.1);
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .divider span { padding: 0 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }

        /* Main Chat UI */
        #mainUI { display: none; flex-direction: column; height: 100%; }
        .header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background: rgba(0,0,0,0.2);
        }
        .header h1 {
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            flex-wrap: wrap;
        }
        .header-info .user-badge {
            background: rgba(102,126,234,0.12);
            padding: 4px 12px;
            border-radius: 20px;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(102,126,234,0.1);
        }
        .header-info .status-indicator {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 4px;
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
        .status-indicator.online { background: #2ed573; box-shadow: 0 0 10px rgba(46,213,115,0.3); }
        .status-indicator.offline { background: #ff4757; box-shadow: 0 0 10px rgba(255,71,87,0.3); animation: none; }
        .status-indicator.connecting { background: #ffa502; box-shadow: 0 0 10px rgba(255,165,2,0.3); animation: statusPulse 0.8s ease-in-out infinite; }
        .header-info .status-text { color: rgba(255,255,255,0.4); }
        .logout-btn {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: rgba(0,0,0,0.15);
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 2px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(102,126,234,0.3); border-radius: 2px; }

        /* Messages */
        .message {
            margin-bottom: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messageAppear 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes messageAppear { from { opacity:0; transform:translateY(12px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .message.received {
            background: rgba(255,255,255,0.04);
            color: #d0d0d0;
            align-self: flex-start;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .message.sent {
            background: linear-gradient(135deg, rgba(102,126,234,0.25), rgba(118,75,162,0.25));
            color: #fff;
            align-self: flex-end;
            margin-left: auto;
            border: 1px solid rgba(102,126,234,0.1);
        }
        .message.error {
            background: rgba(255,71,87,0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255,71,87,0.1);
        }
        .message.system {
            background: rgba(46,213,115,0.06);
            color: #2ed573;
            text-align: center;
            width: 100%;
            max-width: 100%;
            border: 1px solid rgba(46,213,115,0.06);
            font-size: 13px;
        }
        .message.system-broadcast {
            background: rgba(255, 165, 0, 0.12);
            border-left: 4px solid #ffa502;
            color: #ffa502;
            width: 100%;
            max-width: 100%;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .message.system-broadcast .sender {
            font-size: 11px;
            color: rgba(255,165,2,0.5);
            display: block;
            margin-top: 4px;
        }
        .message.weather, .message.news {
            background: rgba(255,255,255,0.02);
            width: 100%;
            max-width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .message.trial-info {
            background: rgba(255,165,2,0.04);
            border-left: 3px solid #ffa502;
            width: 100%;
            max-width: 100%;
            color: #ffa502;
        }
        .message.upgrade-info {
            background: rgba(23,162,184,0.04);
            border-left: 3px solid #17a2b8;
            width: 100%;
            max-width: 100%;
            color: #17a2b8;
        }
        .message.read-line {
            background: rgba(46,213,115,0.04);
            border-left: 3px solid #2ed573;
            width: 100%;
            max-width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #8bc34a;
            animation: highlightLine 0.5s ease;
        }
        @keyframes highlightLine { from { background: rgba(46,213,115,0.1); transform: scale(0.98); } to { background: rgba(46,213,115,0.04); transform: scale(1); } }
        .message.file-message {
            background: rgba(102,126,234,0.04);
            border: 1px solid rgba(102,126,234,0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 100%;
            padding: 16px;
        }
        .file-message video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin-top: 10px;
        }
        .file-message .file-info { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        .file-message .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }
        .file-message .download-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(102,126,234,0.3); }

        /* Weather */
        .weather-day {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .weather-day:hover { background: rgba(255,255,255,0.04); transform: translateX(4px); }
        .weather-day .day-name { min-width: 80px; text-align: center; font-weight: 600; font-size: 14px; color: #fff; }
        .weather-day .day-name .date { font-size: 11px; font-weight: normal; color: rgba(255,255,255,0.25); }
        .weather-day .weather-icon { flex: 0 0 50px; text-align: center; }
        .weather-day .weather-icon img { width: 48px; height: 48px; filter: drop-shadow(0 0 10px rgba(102,126,234,0.1)); }
        .weather-day .weather-info { flex: 1; }
        .weather-day .weather-info .temp { font-size: 17px; font-weight: 600; color: #fff; }
        .weather-day .weather-info .temp-range { font-size: 12px; font-weight: normal; color: rgba(255,255,255,0.25); }
        .weather-day .weather-info .desc { font-size: 13px; color: rgba(255,255,255,0.4); }
        .weather-day .weather-details { text-align: right; font-size: 12px; color: rgba(255,255,255,0.3); }
        .weather-day .weather-details div { margin: 2px 0; }

        /* News */
        .news-article {
            display: flex;
            gap: 14px;
            padding: 14px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .news-article:hover { background: rgba(255,255,255,0.04); transform: translateX(4px); }
        .news-article.featured { border-left: 3px solid #667eea; }
        .news-article .news-image { flex: 0 0 120px; height: 80px; overflow: hidden; border-radius: 8px; background: rgba(255,255,255,0.02); }
        .news-article .news-image img { width: 100%; height: 100%; object-fit: cover; }
        .news-article .news-content { flex: 1; min-width: 0; }
        .news-article .news-content .title { font-weight: 600; font-size: 14px; color: #fff; margin-bottom: 4px; }
        .news-article .news-content .description { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 6px; }
        .news-article .news-content .meta { display: flex; gap: 12px; font-size: 11px; color: rgba(255,255,255,0.2); flex-wrap: wrap; }
        .news-article .news-content .read-link { display: inline-block; margin-top: 6px; font-size: 12px; color: #667eea; text-decoration: none; transition: 0.3s; }
        .news-article .news-content .read-link:hover { color: #764ba2; }

        /* Input */
        .input-area {
            padding: 12px 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: rgba(255,255,255,0.04);
            color: #e0e0e0;
            transition: 0.3s;
        }
        .input-area input:focus { border-color: rgba(102,126,234,0.2); background: rgba(255,255,255,0.06); }
        .input-area input::placeholder { color: rgba(255,255,255,0.15); }
        .input-area button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .input-area button:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(102,126,234,0.2); }

        /* File Upload */
        .file-upload-area {
            padding: 8px 20px;
            background: rgba(0,0,0,0.1);
            border-top: 1px solid rgba(255,255,255,0.02);
            display: none;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .file-upload-area.active { display: flex; }
        .file-upload-area input[type="file"] {
            flex: 1;
            min-width: 150px;
            padding: 6px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }
        .file-upload-area input[type="file"]::file-selector-button {
            padding: 6px 16px;
            background: rgba(102,126,234,0.1);
            color: #fff;
            border: 1px solid rgba(102,126,234,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .file-upload-area input[type="file"]::file-selector-button:hover { background: rgba(102,126,234,0.2); }
        .file-upload-area button {
            padding: 6px 16px;
            background: rgba(46,213,115,0.1);
            color: #2ed573;
            border: 1px solid rgba(46,213,115,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
            white-space: nowrap;
        }
        .file-upload-area button:hover { background: rgba(46,213,115,0.15); }
        .file-upload-area button.stop-read {
            background: rgba(255,71,87,0.1);
            color: #ff6b6b;
            border-color: rgba(255,71,87,0.1);
        }
        .file-upload-area button.stop-read:hover { background: rgba(255,71,87,0.15); }
        .file-upload-area .file-info { color: rgba(255,255,255,0.2); font-size: 12px; white-space: nowrap; }

        /* Reading Progress */
        .reading-progress {
            padding: 6px 20px;
            background: rgba(46,213,115,0.02);
            border-top: 1px solid rgba(46,213,115,0.04);
            display: none;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .reading-progress.active { display: flex; }
        .reading-progress .progress-bar {
            flex: 1;
            min-width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 2px;
            overflow: hidden;
        }
        .reading-progress .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #2ed573);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .reading-progress .stop-speech-btn {
            padding: 3px 12px;
            background: rgba(255,71,87,0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255,71,87,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        .reading-progress .stop-speech-btn:hover { background: rgba(255,71,87,0.15); }

        @media (max-width: 600px) {
            .container { width: 100%; height: 100vh; border-radius: 0; }
            .container::before { border-radius: 0; }
            .message { max-width: 90%; }
            .header h1 { font-size: 14px; }
            .header-info { font-size: 10px; }
            .weather-day { flex-wrap: wrap; gap: 8px; }
            .weather-day .day-name { min-width: 60px; }
            .weather-day .weather-details { text-align: left; width: 100%; }
            .news-article { flex-direction: column; }
            .news-article .news-image { flex: 0 0 150px; width: 100%; height: 150px; }
            .file-upload-area { flex-direction: column; align-items: stretch; }
            .file-upload-area input[type="file"] { width: 100%; }
            .reading-progress { font-size: 11px; }
            #loginScreen { padding: 24px; }
            #loginScreen h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen">
            <h1>Bot Service</h1>
            <p class="subtitle">Login or Create Account</p>
            <div class="login-form">
                <div class="login-error" id="loginError"></div>
                <input type="text" id="loginUsername" placeholder="Username" value="">
                <input type="password" id="loginPassword" placeholder="Password" value="">
                <button class="btn-login" onclick="login(false)">🔑 Login</button>
                <div class="divider"><span>or</span></div>
                <button class="btn-register" onclick="login(true)">📝 Register New Account</button>
                <div class="login-info">
                    <p>👑 <strong>Admin:</strong> blessed / emmanuel</p>
                    <p>✨ New users get <strong>5 free trials</strong></p>
                    <p>🔒 One account per device</p>
                </div>
            </div>
        </div>

        <!-- Main UI -->
        <div id="mainUI">
            <div class="header">
                <h1>⚡ Bot Service</h1>
                <div class="header-info">
                    <span class="user-badge" id="userBadge">👤 Loading...</span>
                    <span>
                        <span class="status-indicator online" id="statusIndicator"></span>
                        <span class="status-text" id="statusText">Connected</span>
                    </span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="chat-area" id="chatArea">
                <div class="message received system">🤖 Welcome! Type <strong>.assist</strong> to see all commands</div>
            </div>

            <div class="reading-progress" id="readingProgress">
                <span>📖 Reading:</span>
                <span id="readingStatus">Loading...</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <span id="progressPercent">0%</span>
                <button class="stop-speech-btn" onclick="stopReading()">⏹️ Stop</button>
            </div>

            <div class="file-upload-area" id="fileUploadArea">
                <input type="file" id="fileInput" accept=".txt,.pdf,.doc,.docx">
                <button onclick="uploadFile()">📤 Upload & Read</button>
                <button class="stop-read" onclick="stopReading()">⏹️ Stop</button>
                <span class="file-info" id="fileInfo">No file selected</span>
            </div>

            <div class="input-area">
                <input type="text" id="commandInput" placeholder="Type a command... (.weather, .news, .assist)">
                <button onclick="sendCommand()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // ===== DEVICE ID (persistent) =====
        let deviceId = localStorage.getItem('botDeviceId');
        if (!deviceId) {
            deviceId = crypto.randomUUID ? crypto.randomUUID() : 'dev-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('botDeviceId', deviceId);
        }
        console.log('🔑 Device ID:', deviceId);

        // ===== STATE =====
        let ws;
        let currentUser = null;
        let userId = null;
        let token = null;
        let isReading = false;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        let reconnectTimeout = null;
        let isWaitingForNextLine = false;

        // ===== CONNECTION =====
        function connectWebSocket(isReconnect = false) {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                reconnectAttempts = 0;
                updateStatus('online', 'Connected');
                if (currentUser) {
                    ws.send(JSON.stringify({
                        type: 'auth',
                        username: currentUser.username,
                        password: currentUser.password || '',
                        isNewUser: false,
                        deviceId: deviceId
                    }));
                }
            };

            ws.onclose = () => {
                console.log('❌ WebSocket disconnected');
                updateStatus('offline', 'Disconnected');
                handleDisconnect();
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('offline', 'Error');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'auth_success') {
                        currentUser = data.data;
                        userId = data.data.userId;
                        token = data.data.token;
                        updateStatus('online', 'Connected');
                        updateUserBadge();
                    } else {
                        handleMessage(data);
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };
        }

        function handleDisconnect() {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 30000);
                updateStatus('connecting', `Reconnecting in ${Math.round(delay/1000)}s... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                reconnectTimeout = setTimeout(() => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) connectWebSocket(true);
                }, delay);
            } else {
                updateStatus('offline', 'Disconnected - Please refresh');
                addMessage('error', '❌ Connection lost. Please refresh the page to reconnect.');
            }
        }

        function updateStatus(state, text) {
            const indicator = document.getElementById('statusIndicator');
            const textEl = document.getElementById('statusText');
            indicator.className = 'status-indicator ' + state;
            textEl.textContent = text;
        }

        function updateUserBadge() {
            if (!currentUser) return;
            const role = currentUser.role === 'admin' ? '👑 Admin' : '👤 User';
            const trialInfo = currentUser.role !== 'admin' ? ` | ${currentUser.trials.used}/${currentUser.trials.total} trials` : '';
            document.getElementById('userBadge').textContent = `${role}: ${currentUser.username} (${currentUser.userId})${trialInfo}`;
        }

        // ===== AUTH =====
        function login(isNewUser) {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (!username || !password) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Please enter username and password';
                return;
            }
            errorDiv.style.display = 'none';

            currentUser = { username, password };
            connectWebSocket();

            setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'auth',
                        username,
                        password,
                        isNewUser,
                        deviceId: deviceId
                    }));
                }
            }, 100);

            const authHandler = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'auth_success') {
                        ws.removeEventListener('message', authHandler);
                        handleAuthSuccess(data);
                    } else if (data.type === 'auth_failed') {
                        ws.removeEventListener('message', authHandler);
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = data.data;
                    }
                } catch (error) { console.error('Auth error:', error); }
            };
            ws.addEventListener('message', authHandler);
        }

        function handleAuthSuccess(data) {
            currentUser = data.data;
            userId = data.data.userId;
            token = data.data.token;

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainUI').style.display = 'flex';
            updateUserBadge();

            if (data.data.isNewUser) {
                addMessage('system', '🎉 Account created successfully! You have 5 free trials.');
            }

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type !== 'auth_success') handleMessage(msg);
                } catch (error) { console.error('Message error:', error); }
            };

            addMessage('system', `✅ Logged in as ${currentUser.username} (${currentUser.userId})`);
            if (currentUser.role === 'admin') addMessage('system', '👑 You are logged in as Admin');
        }

        // ===== TEXT-TO-SPEECH (deep male voice) =====
        function speakText(text, onDone) {
            if (!('speechSynthesis' in window)) {
                if (onDone) onDone();
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 0.6;   // deep male voice
            utterance.volume = 1;

            const voices = window.speechSynthesis.getVoices();
            const maleVoices = voices.filter(v =>
                v.lang.startsWith('en') &&
                (v.name.toLowerCase().includes('male') ||
                 v.name.toLowerCase().includes('david') ||
                 v.name.toLowerCase().includes('mark') ||
                 v.name.toLowerCase().includes('james') ||
                 v.name.toLowerCase().includes('microsoft') ||
                 v.name.toLowerCase().includes('google uk'))
            );
            utterance.voice = maleVoices.length > 0 ? maleVoices[0] : voices.find(v => v.lang.startsWith('en'));

            utterance.onend = () => { if (onDone) onDone(); };
            utterance.onerror = () => { if (onDone) onDone(); };
            window.speechSynthesis.speak(utterance);
        }

        // ===== MESSAGE HANDLING =====
        function handleMessage(data) {
            switch (data.type) {
                case 'weather': {
                    const w = data.data;
                    let html = `<div class="message weather"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><span style="font-size:28px;">🌤️</span><div><strong style="font-size:18px;color:#fff;">Weather Forecast</strong><div style="font-size:13px;color:rgba(255,255,255,0.3);">${w.city}${w.country ? ', '+w.country : ''}</div></div></div>`;
                    w.forecast.forEach(day => {
                        const d = new Date(day.date);
                        const dayName = d.toLocaleDateString('en-US', { weekday:'short' });
                        const monthDay = d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
                        const iconUrl = `https://openweathermap.org/img/wn/${day.icon || '01d'}@2x.png`;
                        html += `<div class="weather-day"><div class="day-name"><div>${dayName}</div><div class="date">${monthDay}</div></div><div class="weather-icon"><img src="${iconUrl}"></div><div class="weather-info"><div class="temp">${Math.round(day.temp_avg)}°C <span class="temp-range">(${Math.round(day.temp_min)}°C - ${Math.round(day.temp_max)}°C)</span></div><div class="desc">${day.description}</div></div><div class="weather-details"><div>💧 ${day.humidity}%</div><div>💨 ${day.windSpeed||0} km/h</div><div>🌡️ Feels ${Math.round(day.feelsLike||day.temp_avg)}°C</div></div></div>`;
                    });
                    if (w.note) html += `<div style="margin-top:12px;font-size:12px;color:#ff6b6b;">${w.note}</div>`;
                    html += '</div>';
                    document.getElementById('chatArea').innerHTML += html;
                    break;
                }
                case 'news': {
                    const n = data.data;
                    let html = `<div class="message news"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><span style="font-size:28px;">📰</span><div><strong style="font-size:18px;color:#fff;">${n.category === 'malawi' ? '🇲🇼 Malawi' : '🌍 Global'} News</strong><div style="font-size:12px;color:rgba(255,255,255,0.2);">${n.total||0} articles</div></div></div>`;
                    n.articles.forEach((a, i) => {
                        const desc = a.description && a.description.length > 200 ? a.description.substring(0,200)+'...' : a.description || 'No description';
                        html += `<div class="news-article ${i===0?'featured':''}">${a.image ? `<div class="news-image"><img src="${a.image}"></div>` : ''}<div class="news-content"><div class="title">${a.title}</div><div class="description">${desc}</div><div class="meta"><span>📌 ${a.source}</span>${a.author && a.author!=='Unknown' ? `<span>✍️ ${a.author}</span>` : ''}<span>📅 ${a.publishedAt}</span></div><a href="${a.url}" target="_blank" class="read-link">🔗 Read full article →</a></div></div>`;
                    });
                    if (n.note) html += `<div style="margin-top:12px;font-size:12px;color:#ff6b6b;">${n.note}</div>`;
                    html += '</div>';
                    document.getElementById('chatArea').innerHTML += html;
                    break;
                }
                case 'read_prompt':
                    document.getElementById('fileUploadArea').classList.add('active');
                    document.getElementById('fileInfo').textContent = 'Ready for upload';
                    addMessage('system', '📄 Please upload a document to read aloud');
                    break;
                case 'read_line': {
                    const line = data.data.content;
                    const lineNum = data.data.lineNumber;
                    const total = data.data.totalLines;
                    addMessage('read-line', `📖 Line ${lineNum}/${total}: ${line}`);
                    const pct = (lineNum / total) * 100;
                    document.getElementById('readingStatus').textContent = `Line ${lineNum}/${total}`;
                    document.getElementById('progressFill').style.width = pct + '%';
                    document.getElementById('progressPercent').textContent = Math.round(pct) + '%';
                    document.getElementById('readingProgress').classList.add('active');
                    isWaitingForNextLine = true;
                    speakText(line, () => {
                        isWaitingForNextLine = false;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'next_line', userId: userId }));
                        }
                    });
                    break;
                }
                case 'read_complete':
                    addMessage('system', '✅ Finished reading the entire document');
                    document.getElementById('readingProgress').classList.remove('active');
                    document.getElementById('fileUploadArea').classList.remove('active');
                    isReading = false;
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    break;
                case 'public':
                    if (data.data.type === 'file') {
                        addMessage('received', `<div class="file-message"><strong style="color:#fff;">📹 ${data.data.message}</strong><br><video controls style="max-width:100%;max-height:400px;border-radius:12px;margin-top:10px;"><source src="${data.data.file.url}" type="video/mp4"></video><div class="file-info">📁 ${data.data.file.name} (${data.data.file.size}) ${data.data.file.quality ? '| Quality: '+data.data.file.quality : ''}</div><a href="${data.data.file.url}" download="${data.data.file.name}" class="download-btn">⬇️ Download Video</a></div>`);
                    } else {
                        addMessage('received', data.data.message);
                    }
                    break;
                case 'system_broadcast':
                    addMessage('system-broadcast', `📢 ${data.data.message}<span class="sender">— ${data.data.sender} • ${new Date(data.data.timestamp).toLocaleTimeString()}</span>`);
                    break;
                case 'confirm': addMessage('sent', `✅ ${data.data}`); break;
                case 'help': addMessage('received', data.data.replace(/\n/g, '<br>')); break;
                case 'developer': {
                    const d = data.data;
                    addMessage('received', `<strong style="color:#fff;">👨‍💻 Developer Information</strong><br><br><strong>Name:</strong> ${d.name}<br><strong>Education:</strong> ${d.education}<br><strong>Program:</strong> ${d.program}<br><strong>Skills:</strong> ${d.skills.join(', ')}`);
                    break;
                }
                case 'tune': addMessage('received', `<strong style="color:#fff;">🔄 Tuned Text</strong><br><br><strong>Original:</strong><br>${data.data.original}<br><br><strong>Humanized:</strong><br>${data.data.humanized}`); break;
                case 'shot_success': {
                    const s = data.data;
                    if (s.downloadLinks) {
                        let links = `<div class="message file-message"><div style="margin-bottom:12px;"><strong style="color:#fff;">📹 ${s.message}</strong></div><div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:12px;">🆔 Video ID: ${s.videoId}<br>🔗 Video URL: <a href="${s.videoUrl}" target="_blank" style="color:#667eea;">${s.videoUrl}</a></div><div style="font-weight:600;margin-bottom:10px;color:#fff;">${s.note}</div>`;
                        s.downloadLinks.forEach(link => {
                            links += `<div style="background:rgba(255,255,255,0.02);padding:10px 14px;border-radius:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.03);"><div style="font-weight:500;color:#fff;">${link.name}</div><div style="font-size:12px;color:rgba(255,255,255,0.3);margin:4px 0;"><a href="${link.url}" target="_blank" style="color:#667eea;">${link.url}</a></div><div style="font-size:11px;color:rgba(255,255,255,0.2);white-space:pre-line;">${link.instructions}</div></div>`;
                        });
                        links += `${s.instruction ? `<div style="margin-top:12px;font-size:12px;color:rgba(255,255,255,0.3);">💡 ${s.instruction}</div>` : ''}</div>`;
                        addMessage('received', links);
                    } else {
                        addMessage('received', `<div class="file-message"><strong style="color:#fff;">📹 ${s.message}</strong><br><video controls style="max-width:100%;max-height:400px;border-radius:12px;margin-top:10px;"><source src="${s.videoUrl}" type="video/mp4"></video><div class="file-info">📁 ${s.filename||'Facebook Video'} (${s.size||'Unknown'}) ${s.quality ? '| Quality: '+s.quality : ''}</div><a href="${s.videoUrl}" download="${s.filename||'video.mp4'}" class="download-btn">⬇️ Download Video</a>${s.note ? `<div style="margin-top:8px;font-size:12px;color:rgba(255,255,255,0.3);">${s.note}</div>` : ''}</div>`);
                    }
                    break;
                }
                case 'shot_progress': addMessage('received', `⏳ ${data.data}`); break;
                case 'trace_progress': addMessage('received', `⏳ ${data.data}`); break;
                case 'trace_success': {
                    const t = data.data;
                    let html = `<div class="message received" style="width:100%;max-width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><span style="font-size:24px;">🗺️</span><div><strong style="color:#fff;font-size:16px;">IP Geolocation</strong><div style="font-size:12px;color:rgba(255,255,255,0.3);">${t.query}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:13px;color:rgba(255,255,255,0.7);"><div><span style="color:rgba(255,255,255,0.3);">🌍 Country</span> ${t.country} (${t.countryCode})</div><div><span style="color:rgba(255,255,255,0.3);">🏙️ Region</span> ${t.region}</div><div><span style="color:rgba(255,255,255,0.3);">📍 City</span> ${t.city}</div><div><span style="color:rgba(255,255,255,0.3);">📮 ZIP</span> ${t.zip}</div><div><span style="color:rgba(255,255,255,0.3);">🌐 Coordinates</span> ${t.lat}, ${t.lon}</div><div><span style="color:rgba(255,255,255,0.3);">🕐 Timezone</span> ${t.timezone}</div><div style="grid-column:1/-1;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;margin-top:4px;"><span style="color:rgba(255,255,255,0.3);">📡 ISP</span> ${t.isp}</div><div style="grid-column:1/-1;"><span style="color:rgba(255,255,255,0.3);">🏢 Organization</span> ${t.org}</div><div style="grid-column:1/-1;"><span style="color:rgba(255,255,255,0.3);">🔗 AS</span> ${t.as} ${t.asname ? '- '+t.asname : ''}</div><div style="grid-column:1/-1;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;margin-top:4px;display:flex;gap:16px;font-size:12px;"><span>📱 Mobile: ${t.mobile}</span><span>🔒 Proxy/VPN: ${t.proxy}</span><span>☁️ Hosting: ${t.hosting}</span></div></div></div>`;
                    document.getElementById('chatArea').innerHTML += html;
                    break;
                }
                case 'error': addMessage('error', `❌ ${data.data}`); break;
                case 'trial_expired': {
                    const info = data.data;
                    let msg = `⚠️ ${info.message}<br><br><strong>Upgrade Information:</strong><br>💰 Price: ${info.upgradeInfo.price}<br>📱 Payment Methods:<br>`;
                    info.upgradeInfo.methods.forEach(m => { msg += `• ${m.provider}: ${m.number}<br>`; });
                    msg += `<br>📲 After payment, send confirmation + your ID to admin on WhatsApp: ${info.upgradeInfo.adminWhatsApp}`;
                    addMessage('upgrade-info', msg);
                    break;
                }
                case 'myid': {
                    const u = data.data;
                    let idMsg = `📋 <strong>Your User Information</strong><br><br>User ID: ${u.userId}<br>Username: ${u.username}<br>Role: ${u.role}<br>Status: ${u.isPremium ? '✅ PREMIUM' : '🆓 Free User'}<br>Trials Used: ${u.trials.used}/${u.trials.total}<br>`;
                    if (u.isPremium) {
                        const daysLeft = Math.ceil((new Date(u.trials.expiry) - new Date()) / (1000*60*60*24));
                        idMsg += `Premium Expiry: ${new Date(u.trials.expiry).toLocaleDateString()} (${daysLeft} days left)`;
                    } else {
                        idMsg += `Remaining Trials: ${u.trials.total - u.trials.used}`;
                    }
                    addMessage('received', idMsg);
                    break;
                }
                case 'deviceid': addMessage('received', `🔑 <strong>Your Device ID</strong><br><br>${data.data.deviceId}<br><br>${data.data.message}`); break;
                case 'trials_info': addMessage('trial-info', data.data.replace(/\n/g, '<br>')); break;
                case 'upgrade_success': addMessage('system', `✅ User ${data.data.userId} (${data.data.username}) upgraded to premium for ${data.data.days} days!<br>Expiry: ${new Date(data.data.expiry).toLocaleDateString()}`); break;
                case 'upgraded': addMessage('system', `🎉 ${data.data.message}<br>Expiry: ${new Date(data.data.expiry).toLocaleDateString()}`); break;
                case 'user_login': addMessage('system', `👤 User ${data.data.userId} (${data.data.username}) logged in${data.data.isNew ? ' (NEW)' : ''} at ${new Date(data.data.time).toLocaleTimeString()}`); break;
                default: console.log('Unknown type:', data.type);
            }
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
        }

        function addMessage(type, content) {
            const chatArea = document.getElementById('chatArea');
            let cls = 'received';
            if (type === 'sent') cls = 'sent';
            else if (type === 'error') cls = 'error';
            else if (type === 'system') cls = 'system';
            else if (type === 'system-broadcast') cls = 'system-broadcast';
            else if (type === 'trial-info') cls = 'trial-info';
            else if (type === 'upgrade-info') cls = 'upgrade-info';
            else if (type === 'read-line') cls = 'read-line';
            chatArea.innerHTML += `<div class="message ${cls}">${content}</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ===== COMMANDS =====
        function sendCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value.trim();
            if (!command || !ws || ws.readyState !== WebSocket.OPEN) {
                if (!ws || ws.readyState !== WebSocket.OPEN) addMessage('error', '❌ Not connected to server.');
                return;
            }
            let cmd = command, args = '';
            const spaceIndex = command.indexOf(' ');
            if (spaceIndex > 0) { cmd = command.substring(0, spaceIndex); args = command.substring(spaceIndex + 1).trim(); }
            ws.send(JSON.stringify({ command: cmd, args: args }));
            addMessage('sent', command);
            input.value = '';
        }

        // ===== READ =====
        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) { alert('Please select a file first'); return; }
            document.getElementById('fileInfo').textContent = `📄 ${file.name}`;
            const formData = new FormData();
            formData.append('file', file);
            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    addMessage('system', `📄 ${data.message}`);
                    document.getElementById('readingStatus').textContent = 'Starting...';
                    startReading();
                })
                .catch(err => alert('Error uploading file: ' + err.message));
        }

        function startReading() {
            fetch('/read/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'start', userId: userId })
            })
            .then(r => r.json())
            .then(data => {
                addMessage('system', `📖 ${data.message}`);
                isReading = true;
            })
            .catch(err => alert('Error starting read: ' + err.message));
        }

        function stopReading() {
            fetch('/read/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'stop', userId: userId })
            })
            .then(r => r.json())
            .then(data => {
                addMessage('system', `⏹️ ${data.message}`);
                document.getElementById('readingProgress').classList.remove('active');
                document.getElementById('fileUploadArea').classList.remove('active');
                isReading = false;
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                if (isWaitingForNextLine) isWaitingForNextLine = false;
            })
            .catch(err => alert('Error stopping read: ' + err.message));
        }

        // ===== LOGOUT =====
        function logout() {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            if (ws) ws.close();
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainUI').style.display = 'none';
            document.getElementById('chatArea').innerHTML = '';
            document.getElementById('readingProgress').classList.remove('active');
            document.getElementById('fileUploadArea').classList.remove('active');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            currentUser = null; userId = null; token = null; isReading = false; reconnectAttempts = 0;
            updateStatus('offline', 'Disconnected');
        }

        // ===== EVENTS =====
        document.getElementById('commandInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendCommand(); });
        document.getElementById('loginPassword').addEventListener('keypress', e => { if (e.key === 'Enter') login(false); });
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (this.files.length > 0) document.getElementById('fileInfo').textContent = `📄 ${this.files[0].name}`;
        });
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // Pre-fill admin
        document.getElementById('loginUsername').value = 'blessed';
        document.getElementById('loginPassword').value = 'emmanuel';
        console.log('🚀 Bot Web Service loaded – device ID:', deviceId);
    </script>
</body>
</html>
